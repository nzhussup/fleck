version: 1

application:
  language: go
  path: ./cmd/api

deployment:
  type: helm
  chart: ./deploy/helm/payment-service
  release: payment-service
  values:
    - ./deploy/helm/payment-service/values-valid.yaml
  workload:
    kind: Deployment
    name: payment-service
    namespace: default
  container: payment-service

dockerfile:
  path: ./Dockerfile

analysis:
  rules: [CFG001, CFG002, CFG003, CFG004, CFG005, CFG006]
