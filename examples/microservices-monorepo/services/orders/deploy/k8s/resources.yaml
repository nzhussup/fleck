apiVersion: v1
kind: ConfigMap
metadata:
  name: orders
data:
  database-url: postgres://database.example/orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: example/orders:local
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: orders
                  key: database-url
            - name: HTTP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector:
    app: orders
  ports:
    - name: http
      port: 80
      targetPort: http
